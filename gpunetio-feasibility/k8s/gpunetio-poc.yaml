# DOCA sample on DRA — server + client Pod manifests for milestone G3-M1-3.
#
# Runs the official gpunetio_rdma_client_server_write sample between two Pods.
# The wiring is identical to perftest-dra.yaml (M1-2); only the image differs.
#
# Each Pod receives:
#   - 1x GPU             via nvidia-dra-driver-gpu (DeviceClass gpu.nvidia.com)
#   - 1x RDMA SR-IOV VF  via the ResourceClaimTemplate the NumaNetwork
#                        controller generates (gpunetio-sample-rct)
#   - an IP on that VF   via dranet BYODP -> webhook-whereabouts-numanetwork
#                        -> whereabouts, resolved from the ipRange below
#
# The containers idle on `sleep infinity`: the sample is started by
# `kubectl exec`, so that the client can be given the server's VF IP after the
# server is up, and a failed run leaves the Pod in place for investigation.
#
# Prerequisites:
#   - the image is pushed to Harbor (GPUNETIO_RDMA_WRITE_SAMPLE_GUIDE.md 6.1)
#   - the perftest-dra.yaml Pods are deleted: each node has one GPU
#
# Usage:
#   kubectl apply -f gpunetio-feasibility/k8s/gpunetio-poc.yaml
#   kubectl wait --for=condition=Ready pod/gpunetio-server pod/gpunetio-client --timeout=600s
#
# Steps after this point are documented in GPUNETIO_RDMA_WRITE_SAMPLE_GUIDE.md chapter 6
# in the knowledge base.
---
# Same refDeviceClass and ipRange as perftest-dra.yaml. whereabouts keeps one
# IPPool per range (192.168.140.0-24), so reusing the range does not hand out
# an address that another NumaNetwork already holds.
apiVersion: numaflow.numaproj.io/v1alpha1
kind: NumaNetwork
metadata:
  name: gpunetio-sample
  namespace: default
spec:
  refDeviceClass:
    name: dranet-e2e-baremetal
  refResourceClaimDranet:
    ipRange: "192.168.140.0/24"
---
# GPU claims are per Pod: a ResourceClaim is reserved by the first Pod that
# consumes it, so server and client cannot share one.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: gpunetio-server-gpu
  namespace: default
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: gpunetio-client-gpu
  namespace: default
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
---
apiVersion: v1
kind: Pod
metadata:
  name: gpunetio-server
  namespace: default
  labels:
    app: gpunetio-sample
    role: server
spec:
  # nodeSelector, not nodeName: DRA allocation is performed by the scheduler.
  # Same direction as M1-2 (client cobalt04 -> server cobalt06).
  nodeSelector:
    kubernetes.io/hostname: cobalt06
  containers:
    - name: gpunetio
      image: 192.168.21.17:30003/gpu-direct-comm/gpunetio-poc:latest
      # Overrides the image ENTRYPOINT (gpunetio_rdma_write).
      command: ["sleep", "infinity"]
      securityContext:
        capabilities:
          add:
            # RDMA pins its memory regions; without IPC_LOCK the memlock limit
            # makes memory registration fail.
            - IPC_LOCK
            # CRI-O does not grant NET_RAW by default. ping carries the file
            # capability cap_net_raw=ep, so without it the kernel refuses to
            # exec ping at all.
            - NET_RAW
      resources:
        claims:
          - name: gpu
          - name: rdma-nic
      env:
        # Drops /usr/local/cuda-13/compat from the image default; see
        # GPUNETIO_K8S_POD_EXECUTION_TEST.md 3-1.
        # Appends the GDRCopy library path (libgdrapi.so, built into the
        # image), as GPUNetIO "Installation and Setup" does with
        # LD_LIBRARY_PATH.
        - name: LD_LIBRARY_PATH
          value: "/usr/mpi/gcc/openmpi-current/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:/opt/mellanox/gdrcopy/src"
  resourceClaims:
    - name: gpu
      resourceClaimName: gpunetio-server-gpu
    # The template mints one claim per Pod: each Pod gets its own VF and IP.
    - name: rdma-nic
      resourceClaimTemplateName: gpunetio-sample-rct
---
apiVersion: v1
kind: Pod
metadata:
  name: gpunetio-client
  namespace: default
  labels:
    app: gpunetio-sample
    role: client
spec:
  nodeSelector:
    kubernetes.io/hostname: cobalt04
  containers:
    - name: gpunetio
      image: 192.168.21.17:30003/gpu-direct-comm/gpunetio-poc:latest
      command: ["sleep", "infinity"]
      securityContext:
        capabilities:
          add:
            - IPC_LOCK
            - NET_RAW
      resources:
        claims:
          - name: gpu
          - name: rdma-nic
      env:
        - name: LD_LIBRARY_PATH
          value: "/usr/mpi/gcc/openmpi-current/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:/opt/mellanox/gdrcopy/src"
  resourceClaims:
    - name: gpu
      resourceClaimName: gpunetio-client-gpu
    - name: rdma-nic
      resourceClaimTemplateName: gpunetio-sample-rct
