apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: webhook-whereabouts-numanetwork
  namespace: system
  labels:
    app.kubernetes.io/name: webhook-whereabouts-numanetwork
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-whereabouts-numanetwork
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-whereabouts-numanetwork
    spec:
      serviceAccountName: webhook-whereabouts-numanetwork
      containers:
        - name: webhook
          image: webhook-whereabouts-numanetwork:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --listen-addr=:8443
            - --whereabouts-bin=/opt/cni/bin/whereabouts
          ports:
            - containerPort: 8443
              name: webhook
              protocol: TCP
          volumeMounts:
            - name: cni-bin
              mountPath: /opt/cni/bin
              readOnly: true
            - name: cni-net-d
              mountPath: /etc/cni/net.d
              readOnly: true
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-net-d
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
