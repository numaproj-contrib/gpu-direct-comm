apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-whereabouts-numanetwork
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-whereabouts-numanetwork
rules:
  - apiGroups:
      - numaflow.numaproj.io
    resources:
      - numanetworks
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webhook-whereabouts-numanetwork
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webhook-whereabouts-numanetwork
subjects:
  - kind: ServiceAccount
    name: webhook-whereabouts-numanetwork
    namespace: system
