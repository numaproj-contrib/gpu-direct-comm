# E2E DeviceClass narrowed to dummy interfaces only.
# Prevents matching non-dummy devices (e.g. cni0) during E2E testing.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: dranet
spec:
  selectors:
    - cel:
        expression: >
          device.driver == "dra.net" &&
          has(device.attributes["dra.net"].type) &&
          device.attributes["dra.net"].type == "dummy"
