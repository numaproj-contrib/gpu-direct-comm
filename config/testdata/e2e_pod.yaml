# E2E sample (Task 11): Pod referencing the ResourceClaimTemplate generated
# by the e2e-numanetwork NumaNetwork (name: <numaNetwork.name>-rct).
apiVersion: v1
kind: Pod
metadata:
  name: e2e-pod
  namespace: default
spec:
  resourceClaims:
    - name: nic
      resourceClaimTemplateName: e2e-numanetwork-rct
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        claims:
          - name: nic
  restartPolicy: Never
