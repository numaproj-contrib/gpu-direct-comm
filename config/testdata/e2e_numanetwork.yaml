# E2E sample (Task 11): numaNetwork whose ipRange is resolved by the
# webhook-whereabouts-numanetwork provider and assigned to a Pod's dummy0
# interface via dranet (webhook profile provider mode).
apiVersion: numaflow.numaproj.io/v1alpha1
kind: NumaNetwork
metadata:
  name: e2e-numanetwork
  namespace: default
spec:
  refDeviceClass:
    name: dranet
  refResourceClaimDranet:
    ipRange: "192.168.10.0/24"
