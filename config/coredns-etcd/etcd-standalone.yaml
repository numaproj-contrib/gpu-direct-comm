# Standalone etcd for CoreDNS etcd plugin.
# Single-instance, no TLS, no persistent storage — suitable for development only.
#
# ClusterIP is fixed so that coredns-custom-configmap.yaml can reference it
# statically. CoreDNS runs with dnsPolicy: Default (node DNS) and cannot
# resolve cluster-internal Service names — an IP address is required.
# 10.43.200.53 is chosen from the upper range of the k3s default Service CIDR
# (10.43.0.0/16) to avoid conflicts with auto-assigned ClusterIPs.
apiVersion: v1
kind: Service
metadata:
  name: etcd-coredns
  namespace: kube-system
  labels:
    app.kubernetes.io/name: etcd-coredns
    app.kubernetes.io/component: dns-backend
spec:
  clusterIP: 10.43.200.53
  ports:
    - name: client
      port: 2379
      targetPort: 2379
  selector:
    app.kubernetes.io/name: etcd-coredns
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd-coredns
  namespace: kube-system
  labels:
    app.kubernetes.io/name: etcd-coredns
    app.kubernetes.io/component: dns-backend
spec:
  serviceName: etcd-coredns
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd-coredns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd-coredns
        app.kubernetes.io/component: dns-backend
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.21
          command:
            - etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://10.43.200.53:2379
            - --data-dir=/var/lib/etcd
          ports:
            - containerPort: 2379
              name: client
          readinessProbe:
            exec:
              command:
                - etcdctl
                - endpoint
                - health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - etcdctl
                - endpoint
                - health
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
      volumes:
        - name: data
          emptyDir: {}
