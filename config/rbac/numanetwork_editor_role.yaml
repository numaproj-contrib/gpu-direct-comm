# This rule is not used by the project gpu-direct-comm itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the numaflow.numaproj.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gpu-direct-comm
    app.kubernetes.io/managed-by: kustomize
  name: numanetwork-editor-role
rules:
- apiGroups:
  - numaflow.numaproj.io
  resources:
  - numanetworks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - numaflow.numaproj.io
  resources:
  - numanetworks/status
  verbs:
  - get
