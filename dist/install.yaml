apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: numanetworks.numaflow.numaproj.io
spec:
  group: numaflow.numaproj.io
  names:
    kind: NumaNetwork
    listKind: NumaNetworkList
    plural: numanetworks
    shortNames:
    - nn
    singular: numanetwork
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NumaNetwork is the Schema for the numanetworks API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of NumaNetwork.
            properties:
              refDeviceClass:
                description: refDeviceClass configures the DRA DeviceClass that provides
                  the NIC type.
                properties:
                  name:
                    description: name is the name of the DeviceClass that defines
                      the NIC type assigned to pods.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              refResourceClaimDranet:
                description: |-
                  refResourceClaimDranet configures the DRANET parameters embedded in the
                  ResourceClaimTemplate generated by the controller.
                properties:
                  ipRange:
                    description: |-
                      ipRange is the CIDR block passed to the dranet webhook profile for IPAM.
                      The controller does NOT embed this directly in the RCT opaque config;
                      it is resolved by the webhook provider at admission time (ADR-0004).
                      Example: "192.168.10.0/24"
                    pattern: ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)/([0-9]|[1-2][0-9]|3[0-2])$
                    type: string
                required:
                - ipRange
                type: object
            required:
            - refDeviceClass
            - refResourceClaimDranet
            type: object
          status:
            description: status defines the observed state of NumaNetwork.
            properties:
              resourceClaimTemplateName:
                description: |-
                  resourceClaimTemplateName is the name of the ResourceClaimTemplate
                  generated by the controller for this NumaNetwork.
                  Convention: <numaNetwork.metadata.name>-rct
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
